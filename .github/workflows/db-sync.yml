# M35: sinkronizacija SADRŽAJNIH tablica u produkcijsku bazu (Supabase).
# Kurirani podaci (ekstrakcije, klasifikacije, holdings, povijest zona)
# nastaju u lokalnoj razvojnoj bazi; dump se commita u repo
# (data/sync/content_dump.json.gz), a ovaj workflow ga primjenjuje na
# produkciju po prirodnim ključevima. Pokreće se RUČNO nakon što je dump
# osvježen i mergean u main.
name: db-sync

on:
  workflow_dispatch:
    inputs:
      recompute:
        description: 'Tickeri za preračun valuacije nakon synca (zarezom, npr. ADPL)'
        required: false
        default: ''
      regen:
        description: 'Regeneriraj exporte + commit + deploy nakon synca (true/false)'
        required: false
        default: 'false'
      admin_sql:
        description: "M62: 'true' = primijeni supabase/migration_admin_users.sql (admin pregled prijavljenih korisnika; idempotentno)"
        required: false
        default: ''
      etf_backfill:
        description: "M63: 'true' = ETF master + povijest cijena sa ZSE (jednokratni backfill; idempotentno)"
        required: false
        default: ''
      newsletter_sql:
        description: "M67: 'true' = primijeni supabase/migration_newsletter.sql (newsletter pretplatnici + admin pregled; idempotentno)"
        required: false
        default: ''
      shareholders:
        description: "M69: 'true' = snapshot top 10 dioničara sa ZSE (sve klase; inače samo 1. u mjesecu)"
        required: false
        default: ''
      discussions_sql:
        description: "M30-AI: 'true' = primijeni supabase/migration_discussions.sql (AI rasprave; idempotentno)"
        required: false
        default: ''
      discussions_seed:
        description: "M30-AI: 'true' = učitaj data/discussions/*.json kao draft runde"
        required: false
        default: ''
      div_fy_repair:
        description: "M74: 'true' = popravi fiskalnu godinu dividendi sa siječanjskim ex-datumom (HPB 21,83 FY2025->FY2024) + reklasifikacija + dps"
        required: false
        default: ''
      blog_meta:
        description: "M78: 'true' = naslovi/meta opisi 6 blog tekstova prema GSC nalazu + brisanje test drafta (idempotentno)"
        required: false
        default: ''

concurrency:
  group: daily-eod     # ne smije se preklapati s daily runom (ista baza)
  cancel-in-progress: false

permissions:
  contents: write   # regen korak (opcionalan) commita osvježene exporte

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Ovisnosti
        run: pip install -r requirements.txt

      - name: Shema (idempotentne migracije)
        env:
          ZSE_DSN: ${{ secrets.ZSE_DSN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'EOF'
          from src.db import get_conn
          from src.daily import ensure_schema
          with get_conn() as conn:
              ensure_schema(conn)
          print("shema ok")
          EOF

      # M62: admin pregled korisnika — SECURITY DEFINER funkcija čita
      # auth.users; ako ZSE_DSN rola nema pristup auth shemi, korak padne
      # s jasnom porukom i migracija se pokreće ručno u SQL editoru
      - name: Admin users migracija (M62, opcionalno)
        if: inputs.admin_sql == 'true'
        env:
          ZSE_DSN: ${{ secrets.ZSE_DSN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'EOF'
          import pathlib
          from src.db import get_conn
          sql = pathlib.Path("supabase/migration_admin_users.sql").read_text(encoding="utf-8")
          with get_conn() as conn, conn.cursor() as cur:
              cur.execute(sql)
              cur.execute("select count(*) from public.admin_users_overview()")
              print("migracija ok; funkcija instalirana (poziv bez admin JWT-a vraća",
                    cur.fetchone()[0], "redaka — očekivano 0)")
          EOF

      # M67: newsletter tablica + admin pregled (RLS + SECURITY DEFINER)
      - name: Newsletter migracija (M67, opcionalno)
        if: inputs.newsletter_sql == 'true'
        env:
          ZSE_DSN: ${{ secrets.ZSE_DSN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'EOF'
          import pathlib
          from src.db import get_conn
          sql = pathlib.Path("supabase/migration_newsletter.sql").read_text(encoding="utf-8")
          with get_conn() as conn, conn.cursor() as cur:
              cur.execute(sql)
              cur.execute("select count(*) from public.admin_newsletter_overview()")
              print("migracija ok; funkcija instalirana (poziv bez admin JWT-a vraća",
                    cur.fetchone()[0], "redaka — očekivano 0)")
          EOF

      # M63: ETF registar + povijest cijena (ZSE tečajnica + securityHistory)
      - name: ETF backfill (M63, opcionalno)
        if: inputs.etf_backfill == 'true'
        env:
          ZSE_DSN: ${{ secrets.ZSE_DSN }}
          PYTHONUNBUFFERED: '1'
        run: python -m src.etfs --backfill

      # M30-AI: shema rasprava (tablice + RLS + seed agenata i limita)
      - name: Discussions migracija (M30-AI, opcionalno)
        if: inputs.discussions_sql == 'true'
        env:
          ZSE_DSN: ${{ secrets.ZSE_DSN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'EOF'
          import pathlib
          from src.db import get_conn
          sql = pathlib.Path("supabase/migration_discussions.sql").read_text(encoding="utf-8")
          with get_conn() as conn, conn.cursor() as cur:
              cur.execute(sql)
              cur.execute("select count(*) from public.ai_agents")
              print("migracija ok; agenata u bazi:", cur.fetchone()[0])
          EOF

      # M30-AI: ručno generirane runde (faza 1) -> draft u bazi
      - name: Discussions seed (M30-AI, opcionalno)
        if: inputs.discussions_seed == 'true'
        env:
          ZSE_DSN: ${{ secrets.ZSE_DSN }}
          PYTHONUNBUFFERED: '1'
        run: python -m scripts.load_discussions

      # M69: izvanredni snapshot dioničara (redovni je 1. u mjesecu iz dailyja)
      - name: Snapshot dioničara (M69, opcionalno)
        if: inputs.shareholders == 'true'
        env:
          ZSE_DSN: ${{ secrets.ZSE_DSN }}
          PYTHONUNBUFFERED: '1'
        run: python -m scripts.scrape_shareholders_zse

      - name: Sync sadržaja (dump -> produkcija)
        env:
          ZSE_DSN: ${{ secrets.ZSE_DSN }}
          PYTHONUNBUFFERED: '1'
        run: python -m scripts.db_sync apply

      # Novi/izmijenjeni sadržaj ne ulazi u valuacije sam od sebe (daily
      # recompute ide samo za taj dan ekstrahirane firme) — ovaj korak to
      # pokriva za eksplicitno navedene tickere.
      # M74: NAKON synca sadržaja (sync bi stariji dump mogao vratiti staro stanje)
      - name: Popravak fiskalne godine dividendi (M74, opcionalno)
        if: inputs.div_fy_repair == 'true'
        env:
          ZSE_DSN: ${{ secrets.ZSE_DSN }}
          PYTHONUNBUFFERED: '1'
        run: python -m scripts.repair_div_fy

      # M78: SEO naslovi/meta opisi blogova (GSC nalaz 30.08.) + test draft
      - name: Blog meta M78 (opcionalno)
        if: inputs.blog_meta == 'true'
        env:
          ZSE_DSN: ${{ secrets.ZSE_DSN }}
          PYTHONUNBUFFERED: '1'
        run: python -m scripts.apply_blog_meta_m78

      - name: Preračun valuacija (opcionalno)
        if: inputs.recompute != ''
        env:
          ZSE_DSN: ${{ secrets.ZSE_DSN }}
          RECOMPUTE: ${{ inputs.recompute }}
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'EOF'
          import datetime as dt, os
          from src.db import get_conn
          from src.daily import _logger, stage_recompute
          tickers = [t.strip().upper() for t in os.environ["RECOMPUTE"].split(",") if t.strip()]
          with get_conn() as conn, conn.cursor() as cur:
              cur.execute("SELECT id, ticker FROM companies WHERE ticker = ANY(%s)", (tickers,))
              rows = cur.fetchall()
              missing = set(tickers) - {t for _, t in rows}
              assert not missing, f"nepoznati tickeri: {missing}"
              run_id = f"db-sync-{dt.date.today().isoformat()}"
              stage_recompute(conn, run_id, _logger(conn, run_id), [i for i, _ in rows])
          print("preračun gotov:", tickers)
          EOF

      - name: Regen exporta + commit + deploy (opcionalno)
        if: inputs.regen == 'true'
        env:
          ZSE_DSN: ${{ secrets.ZSE_DSN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'EOF'
          import datetime as dt
          from src.db import get_conn
          from src.daily import _logger, stage_regen
          with get_conn() as conn:
              run_id = f"db-sync-{dt.date.today().isoformat()}"
              stage_regen(conn, run_id, _logger(conn, run_id), changed=True)
          EOF
          git config user.name "db-sync bot"
          git config user.email "noreply@burzovnilist.com"
          git add frontend/public/data
          if git diff --cached --quiet; then echo "bez promjena"; exit 0; fi
          git commit -m "db-sync $(date +%Y-%m-%d): regen exporta nakon synca sadržaja [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && break
            git rebase --abort 2>/dev/null || true
            sleep $((2**i))
          done
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" -o /dev/null
