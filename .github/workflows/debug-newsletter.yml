# M67 jednokratna provjera newsletter Edge Functiona s runnera (dev
# okruženje ne može do burzovnilist.com). Ukloniti nakon potvrde.
name: debug-newsletter

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/debug_newsletter.py
